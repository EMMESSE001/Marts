<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Per Martina ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(45deg, #ffdee9, #b5fffc, #ffccd5, #ffe3e8);
            background-size: 400% 400%;
            animation: gradientBg 15s ease infinite;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden; position: relative;
        }
        @keyframes gradientBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        #welcome-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffe3e8; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        .btn-start {
            background: linear-gradient(135deg, #ff4b6b 0%, #c92a42 100%);
            color: white; border: none; padding: 18px 40px; font-size: 1.3rem;
            font-weight: bold; border-radius: 50px; cursor: pointer;
            box-shadow: 0 8px 25px rgba(201, 42, 66, 0.4);
        }
        .card {
            background: rgba(255, 255, 255, 0.92); padding: 45px 35px; border-radius: 30px;
            box-shadow: 0 20px 50px rgba(201, 42, 66, 0.15); text-align: center;
            backdrop-filter: blur(15px); border: 3px solid #ffccd5; z-index: 10;
            max-width: 90%; width: 460px; position: relative;
        }
        .card::before {
            content: "❤️ ✨ ❤️ ✨ ❤️ ✨ ❤️ ✨ ❤️";
            position: absolute; top: -18px; left: 0; right: 0; font-size: 1.2rem; letter-spacing: 2px;
        }
        h1 { color: #c92a42; font-size: 2.2rem; margin-bottom: 25px; }
        #countdown {
            font-family: 'Courier New', Courier, monospace; font-size: 2rem; font-weight: bold;
            color: #ffffff; background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            padding: 20px 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #ffb3c1;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.15), 0 5px 15px rgba(255, 117, 140, 0.4);
        }
        .subtitle { color: #d63384; font-size: 1.1rem; font-style: italic; font-weight: bold; margin-bottom: 25px; }
        .btn-surprise {
            background: #cccccc; color: #666666; border: none; padding: 12px 25px;
            font-size: 1.1rem; font-weight: bold; border-radius: 25px; cursor: not-allowed; width: 100%;
        }
        .btn-surprise.active {
            background: linear-gradient(135deg, #ff4b6b 0%, #ff758c 100%);
            color: white; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 75, 107, 0.4);
        }
        #photo-screen,#photo-screen2, #photo-screen3 {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 227, 232, 0.98); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 50; padding: 20px; text-align: center;
        }

        .love-photo {
            max-width: 110%; max-height: 70vh; border-radius: 20px;
            border: 8px solid white; box-shadow: 0 15px 35px rgba(0,0,0,0.15); margin-bottom: 25px; object-fit: cover;
        }
        .love-text-1 { color: #c92a42; font-size: 2.5rem; font-weight: bold; margin-bottom: 10px; animation: bounce 2s infinite; }
        .love-text-2 { color: #d63384; font-size: 1.8rem; font-style: italic; font-weight: bold; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .signature { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); color: #a38f92; font-size: 0.9rem; font-style: italic; letter-spacing: 2px; z-index: 10; }
        
        .floating-item { 
            position: absolute; 
            bottom: -60px; 
            user-select: none; 
            pointer-events: none; 
            z-index: 99; 
            opacity: 1 !important;
            animation: floatUp linear forwards, wobble ease-in-out infinite alternate;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.25);
        }
        @keyframes floatUp { 0% { transform: translateY(0); } 100% { transform: translateY(-115vh); } }
        @keyframes wobble { 0% { margin-left: -25px; } 100% { margin-left: 25px; } }
    </style>
</head>
<body>

    <div id="welcome-overlay">
        <h2 style="color: #c92a42; margin-bottom: 25px; font-size: 1.6rem; text-align: center; padding: 0 20px;">Una sorpresa speciale per Martina... ❤️</h2>
        <button class="btn-start" onclick="checkPasswordAndStart()">Apri il Regalo 🎁</button>
    </div>

    <!-- Lettori Audio -->
    <audio id="bg-music" loop>
        <source src="perfect.mp3" type="audio/mpeg">
    </audio>
    <audio id="birthday-music" loop>
        <source src="auguri.mp3" type="audio/mpeg">
    </audio>

    <div class="card" id="main-card">
        <h1>Festa di Martina! ❤️</h1>
        <div id="countdown">00d 00h 00m 00s</div>
        <div class="subtitle">✨ Il giorno più bello dell'anno si avvicina... ✨</div>
        <button id="surprise-btn" class="btn-surprise" disabled onclick="revealPhoto()">🔒 Sblocca la sorpresa a mezzanotte</button>
    </div>

    <!-- Schermata 1 -->
    <div id="photo-screen">
        <video id="video1" class="love-photo"  playsinline preload="auto">
            <source src="candelina.mp4" type="video/mp4">
        </video>
        <div class="love-text-1">Tanti auguri amore mio ❤️</div>
        <div class="love-text-2">Ti amissimo</div>
        <button class="btn-surprise active" onclick="revealPhoto2()" style="margin-top: 20px; width: auto; cursor: pointer;">Avanti</button>
    </div>

    <!-- Schermata 2 -->
    <div id="photo-screen2">
        <video id="video2" class="love-photo"  playsinline preload="auto">
            <source src="frase.mp4" type="video/mp4">
        </video>
        <div class="love-text-1">Tanti auguri amore mio ❤️</div>
        <div class="love-text-2">Ti amissimo</div>
        <button class="btn-surprise active" onclick="revealPhoto3()" style="margin-top: 20px; width: auto; cursor: pointer;">Avanti</button>
    </div>

    <!-- Schermata 3 -->
    <div id="photo-screen3">
        <img src="foto.jpg" alt="Noi ❤️" class="love-photo">
        <div class="love-text-1">Tanti auguri amore mio ❤️</div>
        <div class="love-text-2">Ti amissimo</div>
    </div>

    <div class="signature">andy potter</div>

    <script>

        const targetDate = new Date('2026-10-28T00:00:00').getTime(); 
        const countdownElement = document.getElementById('countdown');
        const surpriseBtn = document.getElementById('surprise-btn');
        let emojis = ['❤️', '🎈', '💖', '💕', '💝', '✨', '🌸', '👑'];

        window.checkPasswordAndStart = function() {
            const passwordInserita = prompt("Inserisci la parola d'ordine segreta per sbloccare la sorpresa: ❤️");
            if (passwordInserita === "0103") {
                startSurprise();
            } else if (passwordInserita !== null) {
                alert("Password sbagliata! Riprova, la sorpresa è solo per Martina. 🤫");
            }
        };

        function startSurprise() {
            document.getElementById('welcome-overlay').style.display = 'none';
            updateTimer();
            setInterval(updateTimer, 1000);
            setInterval(createFloatingItem, 300);
            try {
                document.getElementById('bg-music').play();
            } catch (e) { console.log("Audio iniziale bloccato."); }
        }

        function updateTimer() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                countdownElement.innerHTML = "00d 00h 00m 00s";
                countdownElement.style.background = "linear-gradient(135deg, #11998e 0%, #38ef7d 100%)";
                surpriseBtn.innerHTML = "🔓 Sblocca la sorpresa per Martina! ❤️";
                surpriseBtn.disabled = false;
                surpriseBtn.classList.add('active');
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            countdownElement.innerHTML = 
                (days < 10 ? "0" + days : days) + "d " + 
                (hours < 10 ? "0" + hours : hours) + "h " + 
                (minutes < 10 ? "0" + minutes : minutes) + "m " + 
                (seconds < 10 ? "0" + seconds : seconds) + "s";
        }

        function createFloatingItem() {
            const item = document.createElement('div');
            item.classList.add('floating-item');
            item.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            item.style.left = (Math.random() * 90) + "vw";
            const size = Math.random() * 20 + 26; 
            item.style.fontSize = size + "px";
            const floatDuration = Math.random() * 3 + 3.5;
            item.style.animationName = 'floatUp, wobble';
            item.style.animationDuration = floatDuration + 's, ' + (Math.random() * 1 + 1) + 's';
            document.body.appendChild(item);
            setTimeout(() => { item.remove(); }, floatDuration * 1000);
        }

        window.revealPhoto = function() {
	    document.getElementById('main-card').style.display = 'none';
	    document.getElementById('photo-screen').style.display = 'flex';
	    const v1 = document.getElementById('video1');
	    if(v1) { 
		v1.load(); v1.play().catch(e => console.log("Riproduzione forzata v1 bloccata")); 
	    }
	    try {
	        document.getElementById('bg-music').pause();
		document.getElementById('birthday-music').pause();
		} catch (e) { console.log("Errore traccia audio."); }
	};
	window.revealPhoto2 = function() {
	    document.getElementById('photo-screen').style.display = 'none';
	    document.getElementById('photo-screen2').style.display = 'flex';
	    const v2 = document.getElementById('video2');
	    if(v2) { 
		v2.load(); v2.play().catch(e => console.log("Riproduzione forzata v2 bloccata")); 
	    }
	};
	window.revealPhoto3 = function() {
	    document.getElementById('photo-screen2').style.display = 'none';
	    document.getElementById('photo-screen3').style.display = 'flex';
	    try {
		document.getElementById('birthday-music').play();
		} catch (e) { console.log("Errore traccia audio."); }

	};
	
       </script>
   </body>
</html>
